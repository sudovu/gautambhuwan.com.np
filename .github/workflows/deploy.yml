name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Submit URLs to IndexNow (Bing & Search Engines)
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "gautambhuwan.com.np",
              "key": "68b31a29f8c04975871239c8942b0e61",
              "keyLocation": "https://gautambhuwan.com.np/68b31a29f8c04975871239c8942b0e61.txt",
              "urlList": [
                "https://gautambhuwan.com.np/",
                "https://gautambhuwan.com.np/about.html",
                "https://gautambhuwan.com.np/projects.html",
                "https://gautambhuwan.com.np/labs.html",
                "https://gautambhuwan.com.np/developments.html",
                "https://gautambhuwan.com.np/skills.html",
                "https://gautambhuwan.com.np/resume.html",
                "https://gautambhuwan.com.np/experience.html",
                "https://gautambhuwan.com.np/services.html",
                "https://gautambhuwan.com.np/blog.html",
                "https://gautambhuwan.com.np/contact.html",
                "https://gautambhuwan.com.np/privacy.html"
              ]
            }' || true
