<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="1; url=https://mail.zoho.com">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Zoho Webmail // Bhuwan Gautam</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #0b0f19;
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 12px;
      padding: 36px 32px;
      max-width: 460px;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.15);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(6, 182, 212, 0.2);
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.15rem;
      margin: 0 0 8px 0;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 0.84rem;
      line-height: 1.6;
      margin: 0 0 20px 0;
    }
    .btn {
      display: inline-block;
      background: #0e7490;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.82rem;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background: #0891b2;
    }
  </style>
  <script>
    window.location.replace("https://mail.zoho.com");
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Launching Webmail Gateway</h1>
    <p>Connecting to secure Zoho Mail inbox for<br><strong style="color: #34d399;">info@gautambhuwan.com.np</strong>...</p>
    <a href="https://mail.zoho.com" class="btn">Click Here if Not Redirected &rarr;</a>
  </div>
</body>
</html>
