<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We're Getting Ready! - gautambhuwan.com.np</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f1f3f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 60px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      text-align: center;
      max-width: 680px;
      width: 100%;
    }
    h1 { font-size: 2.4rem; color: #212529; margin-bottom: 20px; }
    p { font-size: 1.15rem; color: #495057; line-height: 1.6; margin-bottom: 35px; }
    .progress-container {
      background-color: #e9ecef;
      border-radius: 20px;
      height: 16px;
      width: 100%;
      overflow: hidden;
    }
    .progress-bar {
      background-color: #38a169;
      height: 100%;
      width: 45%;
      border-radius: 20px 0 0 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>We're Getting Ready!</h1>
    <p>Our site is currently under construction. Please check back soon for updates!</p>
    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>
  </div>
</body>
</html>
